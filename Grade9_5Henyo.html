<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USA HENYO (GUESS THE MYSTERY FOOD)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0038a8; font-family: 'Anton', sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: background-color 0.2s;
        }

        /* CATEGORY CLUE BOX */
        #category-clue {
            background: #fcd116; color: #000; padding: 10px 60px;
            font-size: 38px; border-radius: 0 0 30px 30px;
            border: 6px solid #000; border-top: none;
            position: fixed; top: 0; z-index: 100;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        /* INTRO OVERLAY */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #fcd116, #ce1126);
            z-index: 200; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            padding: 20px; box-sizing: border-box;
            transition: opacity 1s ease-in-out;
        }

        .main-title-sub {
            font-size: 38px; color: white; text-shadow: 6px 6px 0px #000;
            margin-bottom: 5px; text-transform: uppercase;
        }

        .henyo-highlight {
            font-size: 90px; color: #0038a8; display: block;
            -webkit-text-stroke: 3px #fff; text-shadow: 10px 10px 0px #000;
            line-height: 1.1; margin-bottom: 10px; text-transform: uppercase;
        }

        .tagline {
            font-size: 28px; color: #fff; text-shadow: 4px 4px 0px #000;
            background: rgba(0, 0, 0, 0.3); padding: 8px 25px; border-radius: 20px;
            letter-spacing: 2px;
        }

        /* MAIN GAME */
        #main-game { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: space-between; padding: 80px 0 30px 0; box-sizing: border-box; }
        
        .score-container {
            display: flex; gap: 30px; align-items: center; z-index: 10;
        }

        .score-box { background: #fff; border: 5px solid #000; border-radius: 15px; padding: 10px 30px; text-align: center; min-width: 160px; }
        .score-val { font-size: 55px; color: #ce1126; }

        /* GAME STAGE */
        #game-stage { width: 100%; height: 40vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        
        #word-display { 
            position: absolute; font-size: 20vh; color: #fcd116; 
            text-shadow: 12px 12px 0px #000; -webkit-text-stroke: 4px black; 
            white-space: nowrap; display: flex; align-items: center; gap: 60px;
            animation: loop-scroll 6s linear infinite;
        }

        @keyframes loop-scroll {
            from { transform: translateX(110vw); }
            to { transform: translateX(-110vw); }
        }

        /* BUTTONS */
        .controls { display: flex; gap: 15px; z-index: 10; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 18px 35px; font-size: 24px; border: none; border-radius: 20px; cursor: pointer; text-transform: uppercase; box-shadow: 0 8px 0 #000; transition: 0.1s; font-family: 'Anton'; }
        .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #000; }
    </style>
</head>
<body>

    <div id="category-clue" style="display: none;">CATEGORY: FOOD</div>

    <div id="intro-overlay">
        <div class="main-title-sub">USA HENYO</div>
        <span class="henyo-highlight">GUESS THE MYSTERY FOOD</span>
        <div class="tagline">(LISTEN - THINK - HELP - GUESS)</div>
        <button id="ready-btn" class="btn" style="background:#00ff44; font-size: 36px; margin-top: 35px;" onclick="playIntro()">START GAME! 🎤</button>
    </div>

    <div id="main-game">
        <div class="score-container">
            <div class="score-box"><small style="font-size: 18px;">STOPWATCH</small><div id="stopwatch" class="score-val" style="color:#0038a8;">00:00.00</div></div>
            <div class="score-box"><small style="font-size: 18px;">TOTAL SCORE</small><div id="score-total" class="score-val">0</div></div>
        </div>

        <div id="game-stage">
            <div id="word-display"></div>
        </div>

        <div class="controls">
            <button class="btn" style="background:#fff" onclick="handlePass()">PASS ❌</button>
            <button class="btn" style="background:#ff4747; color: white;" onclick="handleTrash()">TRASH 🗑️ (+5s)</button>
            <button class="btn" style="background:#00ff44" onclick="handleCorrect()">CORRECT ⭕ (+1 PT)</button>
            <button id="next-round-btn" class="btn" style="background:#fcd116; display: none;" onclick="startNextRound()">NEXT ROUND ⏭️</button>
        </div>
    </div>

<script>
    const wordList = [
        { text: "PIZZA", emoji: "🍕", cat: "AMERICAN FOOD" },
        { text: "HAMBURGER", emoji: "🍔", cat: "AMERICAN FOOD" },
        { text: "HOT DOG", emoji: "🌭", cat: "AMERICAN FOOD" }
    ];

    let currentIdx = 0, gameActive = false, totalScore = 0;
    let stopwatchInterval, startTime = 0, elapsedTime = 0;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSynth(freq, start, duration, type = 'triangle', volume = 0.2) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(volume, start);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(start);
            osc.stop(start + duration);
        } catch(e){}
    }

    function startStopwatch() {
        startTime = Date.now() - elapsedTime;
        clearInterval(stopwatchInterval);
        stopwatchInterval = setInterval(() => {
            elapsedTime = Date.now() - startTime;
            updateStopwatchDisplay();
        }, 10);
    }

    function updateStopwatchDisplay() {
        const mins = Math.floor(elapsedTime / 60000).toString().padStart(2, '0');
        const secs = Math.floor((elapsedTime % 60000) / 1000).toString().padStart(2, '0');
        const ms = Math.floor((elapsedTime % 1000) / 10).toString().padStart(2, '0');
        document.getElementById('stopwatch').innerText = `${mins}:${secs}.${ms}`;
    }

    function stopStopwatch() {
        clearInterval(stopwatchInterval);
    }

    function playIntro() {
        audioCtx.resume();
        playSynth(440, audioCtx.currentTime, 0.5, 'square');
        document.getElementById('intro-overlay').style.opacity = "0";
        startStopwatch();
        setTimeout(() => {
            document.getElementById('intro-overlay').style.display = 'none';
            document.getElementById('main-game').style.display = 'flex';
            document.getElementById('category-clue').style.display = 'block';
            startNextRound();
        }, 1000);
    }

    function startNextRound() {
        if (currentIdx >= wordList.length) {
            stopStopwatch();
            document.getElementById('word-display').innerHTML = "FINISH! 🏆";
            document.getElementById('word-display').style.animation = 'none';
            document.getElementById('category-clue').innerText = "GAME OVER";
            document.getElementById('next-round-btn').style.display = 'none';
            return;
        }
        document.getElementById('next-round-btn').style.display = 'none';
        showWord();
        gameActive = true;
    }

    function showWord() {
        const item = wordList[currentIdx];
        document.getElementById('category-clue').innerText = `ROUND ${currentIdx + 1}: ${item.cat}`;
        const wordEl = document.getElementById('word-display');
        wordEl.style.animation = 'none';
        void wordEl.offsetWidth;
        wordEl.style.animation = 'loop-scroll 6s linear infinite';
        wordEl.style.animationPlayState = 'running';
        wordEl.innerHTML = `${item.text} <span>${item.emoji}</span>`;
    }

    function handleCorrect() {
        if (!gameActive) return;
        totalScore++;
        document.getElementById('score-total').innerText = totalScore;
        playSynth(880, audioCtx.currentTime, 0.3, 'sine');
        currentIdx++;
        pauseGame();
    }

    function handlePass() {
        if (!gameActive) return;
        playSynth(200, audioCtx.currentTime, 0.4, 'sawtooth');
        let missed = wordList.splice(currentIdx, 1)[0];
        wordList.push(missed);
        pauseGame();
    }

    function handleTrash() {
        if (!gameActive) return;
        playSynth(150, audioCtx.currentTime, 0.3, 'sawtooth', 0.4);
        
        // Add 5 seconds penalty
        elapsedTime += 5000;
        startTime = Date.now() - elapsedTime;
        updateStopwatchDisplay();

        wordList.splice(currentIdx, 1);
        pauseGame();
    }

    function pauseGame() {
        gameActive = false;
        document.getElementById('word-display').style.animationPlayState = 'paused';
        document.getElementById('next-round-btn').style.display = 'inline-block';
    }
</script>
</body>
</html>
